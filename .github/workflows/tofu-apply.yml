name: Tofu Apply

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "infra/**"
      - "functions/**"

permissions:
  id-token: write # Workload Identity Federation
  contents: read

concurrency:
  group: tofu-apply-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  apply:
    name: Package function & deploy via OpenTofu
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    env:
      # terraform.tfvars is local-only (may contain secret values); CI gets the
      # project id as a variable instead.
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID || 'elevate-1c1e9' }}
      WIF_PROVIDER: ${{ vars.WIF_PROVIDER || '//iam.googleapis.com/projects/97165394176/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider' }}
      DEPLOY_SA: ${{ vars.DEPLOY_SA || 'ai-gateway-deployer@elevate-1c1e9.iam.gserviceaccount.com' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Normalize WIF provider variable
        id: wif
        env:
          WIF_PROVIDER: ${{ env.WIF_PROVIDER }}
        run: |
          # Tolerate both https://iam.googleapis.com/... and //iam.googleapis.com/... forms.
          echo "provider=${WIF_PROVIDER#https://iam.googleapis.com/}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ steps.wif.outputs.provider }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: latest

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Package gateway function bundle
        working-directory: functions
        run: |
          npm ci
          npm run package

      - name: Tofu init
        working-directory: infra
        run: tofu init -input=false

      - name: Tofu apply
        working-directory: infra
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "Applying changes to DEV environment (module.dev)..."
            tofu apply -target=module.dev -auto-approve -input=false -lock-timeout=120s
          else
            echo "Applying changes to PRODUCTION environment..."
            tofu apply -auto-approve -input=false -lock-timeout=120s
          fi

      - name: Publish gateway URL
        working-directory: infra
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            URL=$(tofu output -raw gateway_url_dev)
            ENV="Development"
          else
            URL=$(tofu output -raw gateway_url)
            ENV="Production"
          fi
          {
            echo "### AI Gateway deployed ($ENV) :rocket:"
            echo "Gateway URL: \`$URL\`"
          } >> "$GITHUB_STEP_SUMMARY"
