name: Tofu Apply

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - "functions/**"

permissions:
  id-token: write # Workload Identity Federation
  contents: read

concurrency:
  group: tofu-apply-production
  cancel-in-progress: false

jobs:
  apply:
    name: Package function & deploy via OpenTofu
    runs-on: ubuntu-latest
    environment: production
    env:
      # terraform.tfvars is local-only (may contain secret values); CI gets the
      # project id as a variable instead.
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID || 'elevate-1c1e9' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Normalize WIF provider variable
        id: wif
        env:
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
        run: |
          # Tolerate both https://iam.googleapis.com/... and //iam.googleapis.com/... forms.
          echo "provider=${WIF_PROVIDER#https://iam.googleapis.com/}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ steps.wif.outputs.provider }}
          service_account: ${{ vars.DEPLOY_SA }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: latest

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Package gateway function bundle
        working-directory: functions
        run: |
          npm ci
          npm run package

      - name: Tofu init
        working-directory: infra
        run: tofu init -input=false

      - name: Tofu apply
        working-directory: infra
        run: tofu apply -auto-approve -input=false -lock-timeout=120s

      - name: Publish gateway URL
        working-directory: infra
        run: |
          {
            echo "### AI Gateway deployed :rocket:"
            echo "Gateway URL: \`$(tofu output -raw gateway_url)\`"
          } >> "$GITHUB_STEP_SUMMARY"
