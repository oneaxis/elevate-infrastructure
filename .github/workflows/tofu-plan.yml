name: Tofu Plan

on:
  pull_request:
    paths:
      - "infra/**"
      - "functions/**"

permissions:
  id-token: write # Workload Identity Federation
  contents: read
  pull-requests: write

jobs:
  plan:
    name: Format, type-check, validate & plan
    runs-on: ubuntu-latest
    environment: production
    env:
      # terraform.tfvars is local-only (may contain secret values); CI gets the
      # project id as a variable instead.
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID || 'elevate-1c1e9' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Normalize WIF provider variable
        id: wif
        env:
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
        run: |
          # Tolerate both https://iam.googleapis.com/... and //iam.googleapis.com/... forms.
          echo "provider=${WIF_PROVIDER#https://iam.googleapis.com/}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ steps.wif.outputs.provider }}
          service_account: ${{ vars.DEPLOY_SA }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: latest

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Build & type-check gateway function
        working-directory: functions
        run: |
          npm ci
          npm run package

      - name: Tofu fmt
        working-directory: infra
        run: tofu fmt -check -recursive

      - name: Tofu init
        working-directory: infra
        run: tofu init -input=false

      - name: Tofu validate
        working-directory: infra
        run: tofu validate

      - name: Tofu plan
        id: plan
        working-directory: infra
        run: |
          set -o pipefail
          tofu plan -input=false -no-color -lock-timeout=120s | tee plan.txt

      - name: Post plan summary to PR
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let plan = '';
            try {
              plan = fs.readFileSync('infra/plan.txt', 'utf8');
            } catch {}
            const truncated = plan.length > 60000
              ? plan.slice(0, 60000) + '\n... (truncated)'
              : plan;
            const body = '## OpenTofu Plan Summary\n``````hcl\n' +
              (truncated || 'No plan output captured.') + '\n``````';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find((c) =>
              c.user.type === 'Bot' && c.body.startsWith('## OpenTofu Plan Summary'));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
